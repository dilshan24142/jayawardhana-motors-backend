name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jm_app
          POSTGRES_PASSWORD: jm_app_password
          POSTGRES_DB: jayawardhana_motors_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jm_app -d jayawardhana_motors_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://jm_app:jm_app_password@localhost:5432/jayawardhana_motors_test
      TEST_DATABASE_URL: postgres://jm_app:jm_app_password@localhost:5432/jayawardhana_motors_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
      - run: npm run build
